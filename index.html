<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopify Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="app-frame">
        <header class="topbar" id="topbar"></header>
        <main class="content" id="content" tabindex="-1"></main>
      </div>
    </div>

    <div class="overlay" id="overlay" hidden></div>
    <div class="drawer" id="drawer" aria-hidden="true"></div>
    <div class="modal-layer" id="modal-layer" aria-hidden="true"></div>
    <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>
    <div class="search-overlay" id="search-overlay" hidden></div>
    <div class="bulk-bar" id="bulk-bar" hidden></div>

    <script src="./app.js"></script>
  </body>
</html>
